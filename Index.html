<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bible Class Worldview Flash Cards</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Nunito:wght@400;700&display=swap');

        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #74ebd5 0%, #9face6 100%);
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #333;
        }

        h1 {
            font-family: 'Fredoka', sans-serif;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            margin-bottom: 30px;
            text-align: center;
            padding: 0 20px;
        }

        /* Flashcard Container */
        .card-container {
            width: 90%;
            max-width: 600px;
            height: 350px;
            perspective: 1000px; /* Gives the 3D effect */
            margin-bottom: 30px;
        }

        /* The Card */
        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
            cursor: pointer;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            border-radius: 20px;
        }

        /* Flip class triggered by JavaScript */
        .card.is-flipped {
            transform: rotateY(180deg);
        }

        /* Front and Back of the card */
        .card__face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden; /* Hides the back when flipped */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            box-sizing: border-box;
            border-radius: 20px;
            text-align: center;
            background: #fff;
            border: 4px solid #fff;
        }

        /* Front specific styles */
        .card__face--front {
            background: linear-gradient(135deg, #ffffff 0%, #f3f8ff 100%);
            border-color: #6fb1fc;
        }

        .card__face--front h2 {
            font-family: 'Fredoka', sans-serif;
            font-size: 2.5rem;
            color: #2b5876;
            margin: 0;
        }

        .hint {
            position: absolute;
            bottom: 20px;
            font-size: 0.9rem;
            color: #888;
            opacity: 0.7;
        }

        /* Back specific styles */
        .card__face--back {
            background: linear-gradient(135deg, #ffffff 0%, #fff7e6 100%);
            transform: rotateY(180deg);
            border-color: #ffb86c;
        }

        .card__face--back p {
            font-size: 1.3rem;
            line-height: 1.6;
            margin: 0;
            color: #444;
        }

        .card__face--back ul {
            text-align: left;
            font-size: 1.2rem;
            line-height: 1.6;
            margin: 0;
            padding-left: 25px;
            color: #444;
        }

        .card__face--back li {
            margin-bottom: 10px;
        }

        /* Controls */
        .controls {
            display: flex;
            align-items: center;
            gap: 20px;
            background: rgba(255, 255, 255, 0.3);
            padding: 15px 30px;
            border-radius: 50px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        button {
            background-color: #4e54c8;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1.1rem;
            font-family: 'Fredoka', sans-serif;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(78, 84, 200, 0.4);
        }

        button:hover {
            background-color: #3f44a8;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(1px);
        }

        .counter {
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
            min-width: 80px;
            text-align: center;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .card__face--front h2 { font-size: 2rem; }
            .card__face--back p, .card__face--back ul { font-size: 1.1rem; }
            .card-container { height: 400px; }
        }
    </style>
</head>
<body>

    <h1>Biblical Worldview Flash Cards</h1>

    <div class="card-container" onclick="flipCard()">
        <div class="card" id="flashcard">
            <div class="card__face card__face--front">
                <h2 id="term">Loading...</h2>
                <div class="hint">(Click to flip)</div>
            </div>
            <div class="card__face card__face--back">
                <div id="definition">Loading...</div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button onclick="prevCard()">&#8592; Prev</button>
        <div class="counter" id="counter">1 / 20</div>
        <button onclick="nextCard()">Next &#8594;</button>
    </div>

    <script>
        // Flashcard Data
        const cardsData = [
            { term: "Assumption", definition: "<p>An idea people believe without trying to prove it.</p>" },
            { term: "Basic Beliefs", definition: "<p>Things people believe but probably never think about.</p>" },
            { term: "Big Story", definition: "<p>A way to explain where the world came from, why the world is the way it is, and where the world is going; not all stories can be one.</p>" },
            { term: "Creation", definition: "<p>The act of God to make the heavens and the earth in six days.</p>" },
            { term: "Culture", definition: "<p>Group action based on a common, or shared, worldview.</p>" },
            { term: "Dualism", definition: "<p>The belief that there are two equal gods, one good and one evil.</p>" },
            { term: "Fall", definition: "<p>Adam and Eve's sin.</p>" },
            { term: "Redemption", definition: "<p>God's restoration of sinners to Himself.</p>" },
            { term: "Two-Story View", definition: "<p>The separation of life under two different authorities: 'real life' ruled by science and religion ruled by God.</p>" },
            { term: "Worldview", definition: "<ul><li>The big story, basic beliefs driven by love, and actions.</li><li>Everyone has one, not everyone sees the world in the same way.</li></ul>" },
            { term: "Worldview Parts", definition: "<p>All parts must be true for the worldview to be true.</p>" },
            { term: "Basic Belief", definition: "<p>Cannot always be proven.</p>" },
            { term: "Personal Worldview", definition: "<ul><li>People explain things that happen by fitting them into the big story he or she believes.</li><li>People take action in the world according to how they make sense of the world.</li></ul>" },
            { term: "Assumptions", definition: "<ul><li>Good and bad of these come from someone's worldview.</li><li>Christians can have unbiblical assumptions about the world that need to be brought into check by Scripture.</li></ul>" },
            { term: "Parts of a Worldview", definition: "<ul><li>Big story</li><li>Basic beliefs driven by love</li><li>Actions</li></ul>" },
            { term: "Two Major Kinds of Proof", definition: "<p>Experience and Authority.</p>" },
            { term: "Only God", definition: "<ul><li>Has authority over spiritual reality.</li><li>Has authority over observable things.</li></ul>" },
            { term: "Observation", definition: "<p>One way to know things, but is limited to what a person can confirm with his senses; we can know things based on someone else's authority and do not always need proof by personal observation.</p>" },
            { term: "Bible", definition: "<p>God's Word and the authority that proves things we cannot observe.</p>" },
            { term: "Creation, Fall, Redemption", definition: "<p>Framework of a Biblical Worldview.<br><br><em>(Be able to describe, in sentence form, the pictures of the Biblical Worldview located on p.11)</em></p>" }
        ];

        let currentIndex = 0;
        const cardElement = document.getElementById('flashcard');
        const termElement = document.getElementById('term');
        const definitionElement = document.getElementById('definition');
        const counterElement = document.getElementById('counter');

        // Function to load a card
        function loadCard(index) {
            // Unflip if it's flipped before changing content
            if (cardElement.classList.contains('is-flipped')) {
                cardElement.classList.remove('is-flipped');
                // Wait for flip animation to finish before swapping text
                setTimeout(() => {
                    updateText(index);
                }, 300); // Half of the 0.6s transition time
            } else {
                updateText(index);
            }
        }

        function updateText(index) {
            termElement.innerHTML = cardsData[index].term;
            definitionElement.innerHTML = cardsData[index].definition;
            counterElement.innerText = `${index + 1} / ${cardsData.length}`;
        }

        // Flip mechanism
        function flipCard() {
            cardElement.classList.toggle('is-flipped');
        }

        // Navigation
        function nextCard() {
            if (currentIndex < cardsData.length - 1) {
                currentIndex++;
            } else {
                currentIndex = 0; // Loop back to start
            }
            loadCard(currentIndex);
        }

        function prevCard() {
            if (currentIndex > 0) {
                currentIndex--;
            } else {
                currentIndex = cardsData.length - 1; // Loop to end
            }
            loadCard(currentIndex);
        }

        // Keyboard navigation support
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') {
                if(e.key === ' ') e.preventDefault(); // Prevent scrolling on spacebar
                nextCard();
            } else if (e.key === 'ArrowLeft') {
                prevCard();
            } else if (e.key === 'ArrowUp' || e.key === 'ArrowDown' || e.key === 'Enter') {
                e.preventDefault();
                flipCard();
            }
        });

        // Initialize first card on load
        loadCard(currentIndex);
    </script>
</body>
</html>
